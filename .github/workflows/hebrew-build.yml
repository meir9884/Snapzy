name: Hebrew macOS Installer

on:
  push:
    branches: [hebrew]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hebrew-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Verify Hebrew coverage
        run: |
          python3 tools/localization/verify_hebrew.py
          swift -module-cache-path build/swift-module-cache tools/localization/CatalogTool.swift verify
      - name: Resolve packages and build universal app
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          xcodebuild -project Snapzy.xcodeproj -scheme Snapzy -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" build > build/hebrew-build.log 2>&1 || { tail -100 build/hebrew-build.log; exit 1; }
      - name: Package and verify installer
        run: bash scripts/package-hebrew.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Snapzy-Hebrew-macOS
          path: |
            build/hebrew/Snapzy-Hebrew.dmg
            build/hebrew/SHA256SUMS.txt
            docs/INSTALL.he.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Hebrew-build-diagnostics
          path: build/hebrew-build.log
